<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">catbus — 上车，开往任何平台</title>
  <!-- 猫巴士：车身就是一只橘猫，车头是猫脸和耳朵，车尾是尾巴，轮毂是肉垫；车顶路牌是终端提示符 >_；
       车窗里坐着小红书红、B 站粉、抖音青三只小猫乘客。会颠簸、转轮子、摇尾巴、眨眼、抖耳朵。
       配色取自 Catppuccin Mocha。hero.svg、logo-wordmark.svg 里的猫巴士与这里相同（去掉底板）。 -->
  <defs>
    <linearGradient id="cat-fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB47C"/>
      <stop offset="1" stop-color="#F7894F"/>
    </linearGradient>
    <linearGradient id="cat-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1E2E"/>
      <stop offset="1" stop-color="#181825"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#cat-bg)" stroke="#313244" stroke-width="6"/>

  <!-- 路面与速度线 -->
  <path d="M44 420 H468" stroke="#45475A" stroke-width="7" stroke-linecap="round" stroke-dasharray="30 26">
    <animate attributeName="stroke-dashoffset" values="0;56" dur=".8s" repeatCount="indefinite"/>
  </path>
  <g stroke="#7F849C" stroke-width="7" stroke-linecap="round">
    <path d="M30 262 H60"><animate attributeName="opacity" values=".8;.15;.8" dur=".8s" repeatCount="indefinite"/></path>
    <path d="M18 300 H54"><animate attributeName="opacity" values=".15;.8;.15" dur=".8s" repeatCount="indefinite"/></path>
    <path d="M34 338 H62"><animate attributeName="opacity" values=".8;.15;.8" dur=".8s" begin=".4s" repeatCount="indefinite"/></path>
  </g>

  <!-- 车身随路面颠簸 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur=".4s" repeatCount="indefinite"/>

    <!-- 尾巴 -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 106 270;-16 106 270;0 106 270" dur="1.6s" repeatCount="indefinite"/>
      <path d="M106 270 C72 270 56 242 62 212 C66 192 82 182 96 186" fill="none" stroke="url(#cat-fur)" stroke-width="26" stroke-linecap="round"/>
      <path d="M66 202 C70 192 82 182 96 186" fill="none" stroke="#E0703A" stroke-width="26" stroke-linecap="round"/>
    </g>

    <!-- 耳朵：长在车头顶上；右耳偶尔抖一下 -->
    <g stroke-linejoin="round">
      <path d="M332 176 L352 104 L396 166 Z" fill="#F7A26A" stroke="#F7A26A" stroke-width="14"/>
      <path d="M346 162 L356 124 L380 160 Z" fill="#F5C2E7" stroke="#F5C2E7" stroke-width="6"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 426 180;0 426 180;-14 426 180;6 426 180;0 426 180" keyTimes="0;.72;.78;.86;1" dur="4s" repeatCount="indefinite"/>
        <path d="M404 170 L434 102 L452 192 Z" fill="#F7A26A" stroke="#F7A26A" stroke-width="14"/>
        <path d="M414 166 L432 126 L442 178 Z" fill="#F5C2E7" stroke="#F5C2E7" stroke-width="6"/>
      </g>
    </g>

    <!-- 车身 -->
    <path d="M100 222 C100 188 124 164 160 164 L382 164 C436 164 468 202 468 264 L468 340 C468 368 452 386 426 386 L132 386 C112 386 100 372 100 352 Z" fill="url(#cat-fur)"/>
    <!-- 肚皮 -->
    <path d="M100 330 L468 330 L468 340 C468 368 452 386 426 386 L132 386 C112 386 100 372 100 352 Z" fill="#FFE3C8"/>
    <!-- 轮拱 -->
    <path d="M118 386 A52 52 0 0 1 222 386 Z" fill="#E0703A" opacity=".35"/>
    <path d="M338 386 A52 52 0 0 1 442 386 Z" fill="#E0703A" opacity=".35"/>

    <!-- 车顶的路牌：终端提示符 >_ -->
    <rect x="132" y="174" width="96" height="26" rx="10" fill="#1E1E2E"/>
    <path d="M146 180 L157 187 L146 194" fill="none" stroke="#A6E3A1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="164" y="190" width="20" height="5" rx="2" fill="#FAB387">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <g fill="#F9E2AF" opacity=".9"><circle cx="200" cy="187" r="3.5"/><circle cx="214" cy="187" r="3.5"/></g>

    <!-- 车窗与乘客：小红书红、B 站粉、抖音青三只小猫 -->
    <g fill="#1E1E2E">
      <rect x="124" y="210" width="66" height="68" rx="20"/>
      <rect x="202" y="210" width="66" height="68" rx="20"/>
      <rect x="280" y="210" width="60" height="68" rx="20"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 2;0 -3;0 2" dur=".8s" repeatCount="indefinite"/>
      <g fill="#FF2442"><path d="M139 278 C139 254 145 244 157 244 C169 244 175 254 175 278 Z"/><path d="M141 252 L143 236 L153 246 Z"/><path d="M173 252 L171 236 L161 246 Z"/></g>
      <g fill="#FFFFFF"><circle cx="151" cy="258" r="3.2"/><circle cx="163" cy="258" r="3.2"/></g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -3;0 2;0 -3" dur=".8s" repeatCount="indefinite"/>
      <g fill="#FB7299"><path d="M217 278 C217 254 223 244 235 244 C247 244 253 254 253 278 Z"/><path d="M219 252 L221 236 L231 246 Z"/><path d="M251 252 L249 236 L239 246 Z"/></g>
      <g fill="#FFFFFF"><circle cx="229" cy="258" r="3.2"/><circle cx="241" cy="258" r="3.2"/></g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 1;0 -3;0 1" dur=".8s" begin=".2s" repeatCount="indefinite"/>
      <g fill="#25F4EE"><path d="M292 278 C292 256 298 246 310 246 C322 246 328 256 328 278 Z"/><path d="M294 254 L296 238 L306 248 Z"/><path d="M326 254 L324 238 L314 248 Z"/></g>
      <g fill="#1E1E2E"><circle cx="304" cy="260" r="3.2"/><circle cx="316" cy="260" r="3.2"/></g>
    </g>

    <!-- 车头 = 猫脸 -->
    <g stroke="#E0703A" stroke-width="8" stroke-linecap="round" opacity=".7">
      <path d="M396 176 L398 196"/><path d="M412 174 L412 198"/><path d="M428 176 L426 196"/>
    </g>
    <g fill="#1E1E2E">
      <ellipse cx="384" cy="240" rx="18" ry="22"><animate attributeName="ry" values="22;22;2;22;22" keyTimes="0;.88;.92;.96;1" dur="4s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="440" cy="240" rx="18" ry="22"><animate attributeName="ry" values="22;22;2;22;22" keyTimes="0;.88;.92;.96;1" dur="4s" repeatCount="indefinite"/></ellipse>
    </g>
    <g fill="#FFFFFF"><animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;.88;.92;.96;1" dur="4s" repeatCount="indefinite"/>
      <circle cx="391" cy="232" r="7"/><circle cx="447" cy="232" r="7"/>
      <circle cx="379" cy="250" r="3"/><circle cx="435" cy="250" r="3"/>
    </g>
    <g fill="#F38BA8" opacity=".55"><ellipse cx="366" cy="280" rx="16" ry="9"/><ellipse cx="456" cy="280" rx="10" ry="9"/></g>
    <path d="M405 266 Q412 262 419 266 Q416 273 412 275 Q408 273 405 266 Z" fill="#F38BA8"/>
    <path d="M412 275 Q412 287 403 287 Q396 287 394 280 M412 275 Q412 287 421 287 Q428 287 430 280" fill="none" stroke="#1E1E2E" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 车灯 -->
    <circle cx="456" cy="318" r="9" fill="#F9E2AF"><animate attributeName="opacity" values="1;.55;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <!-- 胡须 -->
    <g stroke="#CDD6F4" stroke-width="4.5" stroke-linecap="round" opacity=".75">
      <path d="M464 268 L496 260"/><path d="M464 282 L496 286"/>
    </g>
  </g>

  <!-- 轮子：轮毂是肉垫，会转 -->
  <g>
    <circle cx="170" cy="388" r="40" fill="#313244" stroke="#1E1E2E" stroke-width="6"/>
    <circle cx="390" cy="388" r="40" fill="#313244" stroke="#1E1E2E" stroke-width="6"/>
    <g fill="#F5C2E7">
      <g><animateTransform attributeName="transform" type="rotate" values="0 170 388;360 170 388" dur="1s" repeatCount="indefinite"/>
        <ellipse cx="170" cy="396" rx="12" ry="10"/><circle cx="156" cy="378" r="6"/><circle cx="170" cy="372" r="6"/><circle cx="184" cy="378" r="6"/></g>
      <g><animateTransform attributeName="transform" type="rotate" values="0 390 388;360 390 388" dur="1s" repeatCount="indefinite"/>
        <ellipse cx="390" cy="396" rx="12" ry="10"/><circle cx="376" cy="378" r="6"/><circle cx="390" cy="372" r="6"/><circle cx="404" cy="378" r="6"/></g>
    </g>
  </g>
</svg>
